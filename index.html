<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>小米视频纹理诊断</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; color: #eee8da; background: #141618; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); }
      main { width: min(100%, 760px); margin: 0 auto; }
      h1 { margin: 0 0 8px; font-size: 22px; color: #d8b36a; }
      h2 { margin: 0; font-size: 17px; }
      p { color: #aaa392; line-height: 1.55; }
      button { min-height: 44px; border: 1px solid #9d8351; border-radius: 10px; padding: 8px 14px; background: #2d3032; color: #f1dfb5; font-size: 15px; }
      button:disabled { opacity: .55; }
      .actions { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; padding: 10px 0; background: rgb(20 22 24 / 94%); }
      .device, .case { margin: 12px 0; border: 1px solid #4e4b42; border-radius: 12px; padding: 12px; background: #202326; }
      .summary { display: none; margin: 12px 0; border: 2px solid #d8b36a; border-radius: 12px; padding: 12px; background: #25231e; }
      .summary.visible { display: block; }
      .summary h2 { margin-bottom: 8px; color: #f1cf87; }
      .summary pre { max-height: none; margin: 0; background: #111; color: #fff; font-size: 13px; }
      .device { font: 12px/1.5 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; white-space: pre-wrap; }
      .case header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
      .status { flex: none; border-radius: 999px; padding: 3px 8px; background: #5e5542; font-size: 12px; }
      .status.ok { background: #365c42; }
      .status.bad { background: #793c35; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      figure { min-width: 0; margin: 0; }
      figcaption { min-height: 34px; margin-bottom: 5px; color: #c7bea8; font-size: 12px; }
      video, canvas { display: block; width: 100%; aspect-ratio: 3 / 4; border: 1px solid #57544d; border-radius: 7px; background: #000; object-fit: contain; }
      pre { max-height: 220px; overflow: auto; margin: 10px 0 0; padding: 9px; border-radius: 7px; background: #111315; color: #bfc5c3; font: 11px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      .note { font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>小米视频纹理诊断</h1>
      <p class="note">请在出现人物黑块的同一台手机和浏览器中点击“开始检测”，等待约 8 秒，再复制结果。</p>
      <div class="actions">
        <button id="start" type="button">开始检测</button>
        <button id="copy" type="button" disabled>复制诊断结果</button>
      </div>
      <section id="summary" class="summary"><h2>结果汇总（请截图）</h2><pre></pre></section>
      <section id="device" class="device">正在读取设备信息…</section>
      <div id="cases"></div>
    </main>
    <script src="./diagnostics.js"></script>
  </body>
</html>
